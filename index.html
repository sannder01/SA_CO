<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Интернет-магазин</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
    }

    .wrapper {
      min-height: 100%;
      display: flex;
      flex-direction: column;
    }

    main {
      flex: 1;
    }

    body {
      font-family: Arial, sans-serif;
      line-height: 1.6;
      position: relative;
      background: url(sacompany.png) no-repeat center center fixed;
      background-size: cover;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      z-index: -1;
    }

    header {
      background: #333;
      color: #fff;
      padding: 0.5rem 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    header h1 {
      font-size: 1.2rem;
    }

    #cart-btn {
      position: relative;
      cursor: pointer;
      font-size: 0.9rem;
    }

    #cart-count {
      position: absolute;
      top: -8px;
      right: -8px;
      background: #e74c3c;
      color: #fff;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
    }

    main {
      padding: 1rem;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 1rem;
    }

    .product-card {
      background: rgba(255, 255, 255, 0.9);
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      font-size: 0.9rem;
    }

.product-card img {
  width: 100%;
  height: 150px; /* одинаковая высота */
  object-fit: cover;
}

.product-info {
  padding: 0.6rem;
  flex-grow: 1;
  display: flex;
  flex-direction: column;
}

.product-info h3 {
  margin-bottom: 0.3rem;
  font-size: 1rem;
}

.product-info p {
  margin-bottom: 0.5rem;
  color: #555;
  flex-grow: 1;
}

.product-info .price {
  font-weight: bold;
  margin-bottom: 0.5rem;
}


    .product-info button {
      background: #6e6e6ec3;
      color: #fff;
      border: none;
      padding: 0.5rem;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.3s;
      font-size: 0.9rem;
    }

    .product-info button:hover {
      background: #219150;
    }

    #cart-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    #cart-content {
      background: #fff;
      border-radius: 8px;
      max-width: 500px;
      width: 100%;
      max-height: 80vh;
      overflow-y: auto;
      padding: 1.5rem;
      position: relative;
    }

    #cart-content h2 {
      margin-bottom: 1rem;
      font-size: 1.4rem;
    }

    #close-cart {
      position: absolute;
      top: 10px;
      right: 10px;
      cursor: pointer;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }

    .cart-item span {
      display: inline-block;
      font-size: 0.9rem;
    }

    .cart-item button.remove {
      background: transparent;
      border: none;
      font-size: 1rem;
      color: #e74c3c;
      cursor: pointer;
    }

    .cart-total {
      margin-top: 1rem;
      font-weight: bold;
      text-align: right;
    }

    #checkout-btn {
      background: #2980b9;
      color: #fff;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 4px;
      cursor: pointer;
      float: right;
      font-size: 0.9rem;
    }

    footer img {
      width: 40px;
      height: 40px;
    }

    #order-form-modal > div {
      padding: 1rem;
      border-radius: 8px;
      max-width: 90%;
    }

    #order-form-modal input {
      padding: 0.5rem;
      font-size: 0.9rem;
    }

    #order-form-modal button {
      padding: 0.6rem;
      font-size: 0.9rem;
    }

    @media (max-width: 600px) {
  .product-card img {
    height: 100px; /* было 150px — уменьшили */
  }

  .product-info {
    padding: 0.5rem;
  }

  .product-info h3 {
    font-size: 0.9rem;
    margin-bottom: 0.2rem;
  }

  .product-info p {
    margin-bottom: 0.3rem;
    font-size: 0.85rem;
  }

  .product-info .price {
    margin-bottom: 0.3rem;
  }

  .product-info button {
    padding: 0.4rem;
    font-size: 0.85rem;
  }
}

      .product-grid {
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      }

      .product-info h3 {
        font-size: 1rem;
      }

      #cart-content {
        padding: 1rem;
        max-width: 95%;
      }

      #cart-content h2 {
        font-size: 1.2rem;
      }

      .cart-item span {
        font-size: 0.9rem;
      }

      #checkout-btn {
        padding: 0.5rem 1rem;
        font-size: 0.9rem;
      }

  </style>
</head>


<body>
<div class="wrapper">
  <header>
    <h1>SA_CO</h1>
    <div id="cart-btn">🛒 Корзина <span id="cart-count">0</span></div>
  </header>

  <main>
    <div class="product-grid" id="products"></div>
  </main>

  <!-- Корзина -->
  <div id="cart-modal">
    <div id="cart-content">
      <span id="close-cart">✖</span>
      <h2>Ваша корзина</h2>
      <div id="cart-items"></div>
      <div class="cart-total">Итого: <span id="total-price">0</span> тг</div>
      <button id="checkout-btn">Оформить заказ</button>
    </div>
  </div>    

  <!-- Мессенджеры -->
  <div id="order-form-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); justify-content:center; align-items:center; z-index:1000;">
  <div style="background:white; padding:2rem; border-radius:10px; max-width:400px; width:90%;">
    <h3 style="margin-bottom:1rem;">Введите данные для доставки</h3>
    <input id="fullName" type="text" placeholder="Имя Фамилия" style="width:100%; padding:0.5rem; margin-bottom:1rem;" required />
    <input id="address" type="text" placeholder="Адрес доставки" style="width:100%; padding:0.5rem; margin-bottom:1rem;" required />
    <input id="phone" type="tel" placeholder="Номер телефона" style="width:100%; padding:0.5rem; margin-bottom:1rem;" required />
    <button onclick="submitOrder()" style="background:#27ae60; color:white; padding:0.75rem 1rem; border:none; border-radius:5px; width:100%;">Отправить заказ</button>
    <button onclick="closeOrderForm()" style="margin-top:1rem; background:#d34738; color:white; padding:0.5rem 1rem; border:none; border-radius:5px; width:100%;">Отмена</button>
  </div>
</div>

  <script>
    
    


    ///ДОБАВЛЕНИЕ ТОВАРОВ
    const productsData = [
      { id: 1, title: "кофта", description: "предзаказ", price: 11000, img: "5350407109461798326_121.jpg" },
      { id: 2, title: "шорты", description: "предзаказ", price: 5000, img: "shorti.jpg" },
      { id: 3, title: "тишка vetements", description: "предзаказ", price: 6000, img: "tshirt_camera.jpg" },
      { id: 4, title: "кофта comme des garcons", description: "предзаказ", price: 8000, img: "kofta_love.jpg" },
      { id: 5, title: "ветровка", description: "предзаказ", price: 15000, img: "vetrivka_blue.jpg" },
      { id: 6, title: "bigboy pants", description: "предзаказ", price: 12000, img: "pants_bigboy.jpg" }

    ];





    const productsContainer = document.getElementById('products');
    const cartBtn = document.getElementById('cart-btn');
    const cartModal = document.getElementById('cart-modal');
    const closeCart = document.getElementById('close-cart');
    const cartCountEl = document.getElementById('cart-count');
    const cartItemsEl = document.getElementById('cart-items');
    const totalPriceEl = document.getElementById('total-price');
    const checkoutBtn = document.getElementById('checkout-btn');


    let cart = [];

    function renderProducts() {
      productsData.forEach(prod => {
        const card = document.createElement('div');
        card.className = 'product-card';
        card.innerHTML = `
          <img src="${prod.img}" alt="${prod.title}">
          <div class="product-info">
            <h3>${prod.title}</h3>
            <p>${prod.description}</p>
            <div class="price">${prod.price} тг</div>
            <button onclick="addToCart(${prod.id})">Добавить в корзину</button>
          </div>
        `;
        productsContainer.appendChild(card);
      });
    }

    function addToCart(id) {
      const item = productsData.find(p => p.id === id);
      const existing = cart.find(c => c.id === id);
      if (existing) existing.qty++;
      else cart.push({ ...item, qty: 1 });
      updateCartUI();
    }

    function removeFromCart(id) {
      cart = cart.filter(item => item.id !== id);
      updateCartUI();
    }

    function updateCartUI() {
      cartCountEl.textContent = cart.reduce((sum, item) => sum + item.qty, 0);
      cartItemsEl.innerHTML = '';
      let total = 0;
      cart.forEach(item => {
        total += item.price * item.qty;
        const div = document.createElement('div');
        div.className = 'cart-item';
        div.innerHTML = `
          <span>${item.title} x ${item.qty}</span>
          <div>
            <span>${item.price * item.qty} тг</span>
            <button class="remove" onclick="removeFromCart(${item.id})">✖</button>
          </div>
        `;
        cartItemsEl.appendChild(div);
      });
      totalPriceEl.textContent = total;
    }

    cartBtn.addEventListener('click', () => cartModal.style.display = 'flex');
    closeCart.addEventListener('click', () => cartModal.style.display = 'none');

    

  renderProducts();
</script>
<script>

    

const BOT_TOKEN = ":";
const CHAT_ID = ""; // Пример: "-1001234567890"

function isValidPhone(phone) {
  // Удалим пробелы и +, затем проверим, что остались только цифры, длиной от 10 до 15
  const cleaned = phone.replace(/\s+/g, '').replace(/^\+/, '');
  return /^\d{10,11}$/.test(cleaned);
}

function submitOrder() {
  if (cart.length === 0) {
    alert("Корзина пуста!");
    return;
  }

  const name = document.getElementById('fullName').value.trim();
  const address = document.getElementById('address').value.trim();
  const phone = document.getElementById('phone').value.trim();

  if (!name || !address || !phone) {
    alert("Пожалуйста, заполните все поля.");
    return;
  }

  if (!isValidPhone(phone)) {
    alert("Пожалуйста, введите корректный номер телефона");
    return;
  }

  let message = `🛒 Новый заказ:\n`;
  message += `👤 Имя: *${name}*\n📍 Адрес: *${address}*\n📞 Телефон: *${phone}*\n\n`;
  message += `📦 Товары:\n`;

  cart.forEach(item => {
    message += `• ${item.title} x ${item.qty} = ${item.price * item.qty} тг\n`;
  });

  message += `\n💰 Итого: *${cart.reduce((sum, i) => sum + i.qty * i.price, 0)}* тг`;

  fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      chat_id: CHAT_ID,
      text: message,
      parse_mode: "Markdown"
    })
  }).then(() => {
    alert("Заказ отправлен!");
    cart = [];
    updateCartUI();
    closeOrderForm();
    document.getElementById('fullName').value = '';
    document.getElementById('address').value = '';
    document.getElementById('phone').value = '';
  });
}

function closeOrderForm() {
  document.getElementById('order-form-modal').style.display = 'none';
}

  checkoutBtn.addEventListener('click', () => {
  cartModal.style.display = 'none';
  document.getElementById('order-form-modal').style.display = 'flex';
});
</script>
</div>
<!-- Связь с персоналом (в самом низу страницы) -->
<footer style="background: rgba(255, 255, 255, 0.219); padding: 2rem; text-align: center; margin-top: 3rem;">
  <h3>Обратная связь</h3>
  <div style="margin-top: 1rem; display: flex; gap: 2rem; justify-content: center; align-items: center;">
    <a href="https://t.me/Zech100" target="_blank">
      <img src="https://img.icons8.com/sf-regular-filled/144/telegram.png" alt="Telegram" style="width: 70px; height: 70px; transition: transform 0.2s;" onmouseover="this.style.transform='scale(1.1)'" onmouseout="this.style.transform='scale(1)'">
    </a>
    <a href="https://wa.me/+77752101725" target="_blank">
      <img src="https://img.icons8.com/ios-glyphs/144/whatsapp.png" alt="WhatsApp" style="width: 60px; height: 60px; transition: transform 0.2s;" onmouseover="this.style.transform='scale(1.1)'" onmouseout="this.style.transform='scale(1)'">
    </a>
  </div>
</footer>

</body>
</html>
